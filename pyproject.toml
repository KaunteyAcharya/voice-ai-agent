[project]
name = "tatsat-voice-agent"
version = "1.0.0"
description = "Aditi - a real-time Hindi + English AI voice agent for a fictional Ahmedabad real estate agency, built with Pipecat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[google,groq,kokoro,sarvam,silero,webrtc]==1.12.0",
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.1",
    "edge-tts==7.3.1",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]
evals = [
    "pipecat-ai[cli,runner]==1.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
asyncio_mode = "auto"
